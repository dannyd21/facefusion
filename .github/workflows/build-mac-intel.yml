name: Build Standalone macOS App (Intel)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-intel-mac:
    runs-on: macos-15-intel # Current GitHub Actions Intel x86_64 runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sed -i '' 's/onnxruntime==1.31.0/onnxruntime==1.23.2/' requirements.txt
          pip install -r requirements.txt
          pip install rumps pyinstaller

      - name: Set up FFmpeg
        run: |
          brew install ffmpeg || true

      - name: Build Standalone FaceFusion.app
        run: |
          python -m PyInstaller launcher/FaceFusion-Standalone.spec --noconfirm

      - name: Inject bundled FFmpeg into App Bundle
        run: |
          mkdir -p "dist/FaceFusion.app/Contents/MacOS"
          cp $(which ffmpeg) "dist/FaceFusion.app/Contents/MacOS/"
          cp $(which ffprobe) "dist/FaceFusion.app/Contents/MacOS/"

      - name: Build macOS .pkg Installer
        run: |
          pkgbuild \
            --component "dist/FaceFusion.app" \
            --install-location "/Applications" \
            --identifier "io.facefusion.pkg" \
            --version "3.9.2" \
            --scripts installer/scripts \
            FaceFusion-component.pkg
          productbuild \
            --distribution installer/distribution.xml \
            --resources installer/resources \
            --package-path . \
            FaceFusion-Installer.pkg

      - name: Upload .pkg Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-macOS-Installer-PKG
          path: FaceFusion-Installer.pkg

      - name: Package into DMG
        run: |
          mkdir -p dmg_root
          cp -R "dist/FaceFusion.app" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "FaceFusion" -srcfolder dmg_root -ov -format UDZO FaceFusion-Intel-macOS.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceFusion-Intel-macOS
          path: FaceFusion-Intel-macOS.dmg
