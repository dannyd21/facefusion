<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        color: #1d1d1f;
        padding: 10px;
    }
    h1 {
        font-size: 18px;
        color: #2e7d32;
        margin-top: 0;
    }
    .card {
        background-color: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        padding: 12px;
        margin: 15px 0;
    }
</style>
</head>
<body>
    <h1>Installation Succeeded!</h1>
    <div class="card">
        <strong>FaceFusion is ready to use!</strong>
        <p style="margin: 6px 0 0 0;">You can now open <strong>FaceFusion</strong> from your <strong>Applications</strong> folder or via Spotlight (⌘ + Space).</p>
    </div>
    <p>When launched, FaceFusion will run silently in the background and open the web interface in your default browser.</p>
    <p>Click <strong>Close</strong> to complete the setup.</p>
</body>
</html>
